# suite-managed (deploy) — regenerated by conform, do not edit by hand.
# Local overrides (NOT generated): put them in deploy/docker-compose.override.yml.
name: brain-editor
services:
  brain-editor-backend:
    image: brain-editor-backend:dev
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: dev
    container_name: brain-editor-backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    ports:
      - "10610:10510"
    volumes:
      - ../backend:/app/backend
    networks:
      - personal-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:10510/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  brain-editor-frontend:
    image: brain-editor-frontend:dev
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      target: dev
    container_name: brain-editor-frontend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      VITE_BACKEND_PROXY_TARGET: "http://brain-editor-backend:10510"
    ports:
      - "3944:3844"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      brain-editor-backend:
        condition: service_healthy
    networks:
      - personal-net
networks:
  personal-net:
    external: true
